name: mesh_app
description: "Smart doorbell + BLE-Mesh light control app (iOS-style)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # MQTT signalling (doorbell events/commands + reserved mesh light control)
  mqtt_client: ^10.8.0

  # MJPEG-over-HTTP live view (pure-Dart frame parsing; ESP32-S3 serves :81/stream)
  http: ^1.2.0

  # Unified ESP protocomm provisioning over BLE, with SoftAP fallback.
  flutter_blue_plus: 1.36.8
  flutter_local_notifications: 19.5.0
  permission_handler: 12.0.3
  protobuf: ^6.0.0
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  logger: ^2.5.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/device_icons/
